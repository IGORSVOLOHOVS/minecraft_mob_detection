# Only the project's own code is checked. configs/, tools/ and demo/ are a
# vendored fork of mmdetection; running a linter over them would report
# thousands of findings in somebody else's project.
name: Python CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install what the helpers need
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pandas matplotlib opencv-python-headless pillow fpdf2 numpy

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest
