# pyproject.toml - Python's own file for minecraft-mob-detection.
#
# It pins the toolchain. `recipe.ps1 test` runs pytest, mypy, ruff check and ruff
# format, and every setting those four read is here. There are no task-runner
# sections: the recipe's verbs are the tasks.
#
# Only the project's own code is configured here: `mobtools/`, `utils.py` and
# `tests/`. `configs/`, `tools/` and `demo/` are vendored from mmdetection
# (THIRD_PARTY.md), and linting, reformatting or measuring them would judge
# somebody else's project. The one lab file under `tools/`, `tools/wiki.py`, is
# type-checked by name.

[build-system]
# Pinned with a version, not a bare name: an unpinned backend changes what
# `recipe.ps1 build` produces without anyone editing this file.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-mob-detection"
# This must equal $Version in recipe.ps1: `recipe.ps1 test` fails when they disagree.
version = "1.0.0"
description = "Helpers that prepare a COCO dataset of Minecraft mobs for YOLO, compare YOLOv8 with FCOS and write the PDF report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
# What mobtools/ imports. The notebook's training stack (PyTorch, mmcv, mmdet,
# ultralytics) is not here: it downloads weights, wants a GPU and Python 3.10, and
# README.md installs it separately.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "fpdf2>=2.8",
]

[dependency-groups]
# `uv run` installs this group by default, so test.yaml's Runner health step finds
# ruff, pytest and mypy through `uv run --frozen <tool> --version`.
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
    "coverage==7.15.2",
    "pillow>=10.0",
    "pandas-stubs>=2.2",
]

[tool.setuptools]
packages = ["mobtools"]
py-modules = ["utils"]

[tool.uv]
# The tests and `recipe.ps1 run` use the source tree, so uv does not install the project.
package = false

[tool.ruff]
# Ruff refuses to run at all when its own version is not this one.
required-version = "0.16.1"
target-version = "py313"
line-length = 100
# The project's own files only, as before the lab: the vendored mmdetection tree
# and the notebook stay out of both the linter and the formatter.
include = ["mobtools/**/*.py", "tests/**/*.py", "utils.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN"]
# RUF001 flags Cyrillic letters as "ambiguous" against their Latin
# lookalikes. The report is written in Russian on purpose, so every string
# in it would be a finding.
ignore = ["ANN401", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001"]

[tool.ruff.format]
line-ending = "lf"
# Section 7 prints these files verbatim, so the formatter must not touch them.
exclude = [".claude/**", "tests/manual/serve.py", "tools/wiki.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# The package sits at the root, so the root goes on sys.path however pytest is started.
pythonpath = ["."]
# Measured on adoption: 224 of 224 statements of mobtools/ and utils.py, 100%. The floor is
# the whole number below. The notebook and the vendored tree are not measured (R-12 issue).
addopts = "-q --cov=mobtools --cov=utils --cov-report=term-missing --cov-fail-under=99"

[tool.coverage.run]
# This project's own code and nothing vendored: configs/, tools/ and demo/ are never measured.
source = ["mobtools", "utils"]

[tool.mypy]
python_version = "3.13"
files = ["mobtools", "utils.py", "tools/wiki.py"]
mypy_path = "."
explicit_package_bases = true
